<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Abdullah Siyadh</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07070b">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--bg:#07070b;--text:#f5f3f8;--muted:rgba(245,243,248,.66);--faint:rgba(245,243,248,.42);--accent-ink:#ff5a74;
  --glass:rgba(255,255,255,.03);--glass-2:rgba(255,255,255,.075);--glass-border:rgba(255,255,255,.1);--glass-hi:rgba(255,255,255,.14);
  --ring:0 0 0 0 transparent;--shadow:0 30px 60px -30px rgba(0,0,0,.8);--stroke:rgba(255,255,255,.12);
  --blob-a:#e8002d;--blob-b:#f5a623;--blob-c:#7a0f3a;--blob-op:.42;
  --grad-text:linear-gradient(100deg,#ff4d6a 5%,#ff7a45 55%,#f5a623 100%);
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#f6f3f1;--text:#16131b;--muted:rgba(22,19,27,.68);--faint:rgba(22,19,27,.46);--accent-ink:#c9002a;
  --glass:rgba(255,255,255,.4);--glass-2:rgba(255,255,255,.66);--glass-border:rgba(255,255,255,.8);--glass-hi:rgba(255,255,255,.95);
  --ring:0 0 0 1px rgba(22,19,27,.05);--shadow:0 30px 50px -32px rgba(90,20,35,.35);--stroke:rgba(22,19,27,.12);
  --blob-a:#ff5c7a;--blob-b:#ffc46b;--blob-c:#ffb0c0;--blob-op:.5;--grad-text:linear-gradient(100deg,#e8002d 5%,#f0441f 55%,#d98200 100%)}}
body{min-height:100svh;display:grid;place-items:center;padding:24px 16px;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob-op)}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:var(--blob-a);animation:f 26s ease-in-out infinite alternate}
.b2{width:40vmax;height:40vmax;right:-14vmax;bottom:-10vmax;background:var(--blob-c);animation:f 32s ease-in-out infinite alternate-reverse}
.b3{width:28vmax;height:28vmax;left:40vw;bottom:-14vmax;background:var(--blob-b);opacity:calc(var(--blob-op)*.6)}
@keyframes f{to{transform:translate(6vw,6vh) scale(1.1)}}
.card{position:relative;width:100%;max-width:520px;padding:44px 40px 40px;border-radius:30px;text-align:center;
  background:linear-gradient(180deg,var(--glass-2),var(--glass));border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--ring),var(--shadow)}
.code{font-size:clamp(5rem,20vw,8rem);font-weight:600;letter-spacing:-.07em;line-height:.9;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:18px}
h1{font-size:clamp(1.5rem,5vw,1.9rem);font-weight:600;letter-spacing:-.03em;margin-top:10px}
p{color:var(--muted);margin:10px auto 28px;max-width:340px;line-height:1.7}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:500;font-size:.95rem;text-decoration:none;border:1px solid transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.btn:hover{transform:translateY(-2px)}
.primary{background:linear-gradient(180deg,#ff1f47,#e8002d);color:#fff;box-shadow:0 12px 30px -12px rgba(232,0,45,.85),inset 0 1px 0 rgba(255,255,255,.3)}
.ghost{background:var(--glass-2);border-color:var(--glass-border);color:var(--text)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.blob{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<main class="card">
  <div class="code" aria-hidden="true">404</div>
  <div class="eyebrow">Page not found</div>
  <h1>This page doesn't exist.</h1>
  <p>The link may be old or mistyped. Everything lives on the home page.</p>
  <div class="btns">
    <a class="btn primary" href="/">Back to home</a>
    <a class="btn ghost" href="/#contact">Get in touch</a>
  </div>
</main>
</body>
</html>
